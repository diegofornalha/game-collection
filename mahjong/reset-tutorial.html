<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Tutorial - Mahjong</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
        p {
            color: #666;
            margin-bottom: 2rem;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0.5rem;
        }
        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        .success {
            color: #48bb78;
            font-weight: bold;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Tutorial Mahjong</h1>
        <p>Use esta página para resetar o tutorial e vê-lo novamente.</p>
        
        <button onclick="resetTutorial()">🔄 Resetar Tutorial</button>
        <button onclick="goToGame()">🎮 Ir para o Jogo</button>
        
        <div id="success" class="success">
            ✅ Tutorial resetado com sucesso!
        </div>
    </div>
    
    <script>
        function resetTutorial() {
            localStorage.removeItem('mahjong-tutorial-completed');
            document.getElementById('success').style.display = 'block';
            setTimeout(() => {
                document.getElementById('success').style.display = 'none';
            }, 3000);
        }
        
        function goToGame() {
            window.location.href = 'http://localhost:3667/';
        }
    </script>
</body>
</html>
